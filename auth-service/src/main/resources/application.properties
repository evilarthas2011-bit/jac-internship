server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5435/authdb
spring.datasource.username=authuser
spring.datasource.password=authpassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=disabled
spring.security.user.password=disabled