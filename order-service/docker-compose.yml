services:
  postgres-order:
    image: postgres:15-alpine
    container_name: order-service-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpassword
    ports:
      - "5436:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data

volumes:
  order_postgres_data: